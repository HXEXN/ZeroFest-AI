name: ZeroFest CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild the synthetic festival dataset from scratch
        run: |
          python scripts/generate_synthetic_festival_data.py
          python scripts/prepare_final_training_data.py

      - name: Run tests
        run: pytest -q
