<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FBFCFE"/><stop offset="1" stop-color="#F1F7F6"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#102A43" flood-opacity=".08"/></filter>
  </defs>
  <rect width="1800" height="1000" fill="url(#bg)"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
    <text x="80" y="77" font-size="40" font-weight="700" fill="#102A43">ZeroFest AI Closed-loop 운영 아키텍처</text>
    <text x="80" y="117" font-size="20" fill="#657A8D">데이터 수집부터 예측·위험판정·사람 승인·현장 실행·성과 환류까지 하나의 운영 루프로 연결합니다.</text>

    <g font-size="15" font-weight="700" letter-spacing="1.2">
      <text x="80" y="180" fill="#687D90">1  데이터 입력</text>
      <text x="390" y="180" fill="#286BE6">2  예측·위험 판정</text>
      <text x="1290" y="180" fill="#7449EB">3  행동 후보 생성</text>
      <text x="980" y="648" fill="#D76819">4  사람 승인·실행</text>
    </g>

    <!-- input cards -->
    <g filter="url(#shadow)">
      <rect x="80" y="220" width="235" height="100" rx="18" fill="#FFFFFF" stroke="#C8D5E2" stroke-width="2"/>
      <rect x="80" y="345" width="235" height="100" rx="18" fill="#FFFFFF" stroke="#C8D5E2" stroke-width="2"/>
      <rect x="80" y="470" width="235" height="100" rx="18" fill="#FFFFFF" stroke="#C8D5E2" stroke-width="2"/>
    </g>
    <g text-anchor="middle">
      <text x="197" y="257" font-size="20" font-weight="700" fill="#223D55">과거 축제 이력</text>
      <text x="197" y="286" font-size="17" fill="#607589">2023–2025 CSV</text>
      <rect x="222" y="292" width="78" height="20" rx="10" fill="#FFF1CB"/><text x="261" y="307" font-size="11" font-weight="700" fill="#95620A">합성 데이터</text>
      <text x="197" y="383" font-size="20" font-weight="700" fill="#223D55">당일 판매·재고</text><text x="197" y="416" font-size="17" fill="#607589">30분 단위 상태</text>
      <text x="197" y="508" font-size="20" font-weight="700" fill="#223D55">날씨·공연 일정</text><text x="197" y="541" font-size="17" fill="#607589">외부 맥락</text>
    </g>

    <!-- joining paths -->
    <g fill="none" stroke="#899AAA" stroke-width="3">
      <path d="M315 270L360 368"/><path d="M315 395L360 395"/><path d="M315 520L360 422"/>
      <line x1="600" y1="395" x2="675" y2="395"/>
      <line x1="925" y1="395" x2="1000" y2="395"/>
      <line x1="1250" y1="395" x2="1325" y2="395"/>
      <line x1="1450" y1="465" x2="1450" y2="682"/>
      <line x1="1325" y1="747" x2="1250" y2="747"/>
      <line x1="1000" y1="747" x2="925" y2="747"/>
    </g>
    <!-- explicit arrowheads -->
    <g fill="#899AAA">
      <path d="M360 395L345 386L345 404Z"/>
      <path d="M675 395L660 386L660 404Z"/>
      <path d="M1000 395L985 386L985 404Z"/>
      <path d="M1325 395L1310 386L1310 404Z"/>
      <path d="M1450 682L1441 667L1459 667Z"/>
      <path d="M1250 747L1265 738L1265 756Z"/>
      <path d="M925 747L940 738L940 756Z"/>
    </g>

    <!-- model pipeline -->
    <g filter="url(#shadow)">
      <rect x="360" y="325" width="240" height="140" rx="20" fill="#EEF5FF" stroke="#3478F6" stroke-width="3"/>
      <rect x="675" y="325" width="250" height="140" rx="20" fill="#EDF9F2" stroke="#27A65A" stroke-width="3"/>
      <rect x="1000" y="325" width="250" height="140" rx="20" fill="#FFF5EC" stroke="#F47B20" stroke-width="3"/>
      <rect x="1325" y="325" width="250" height="140" rx="20" fill="#F5F0FF" stroke="#8252F2" stroke-width="3"/>
    </g>
    <g text-anchor="middle">
      <text x="480" y="366" font-size="21" font-weight="700" fill="#2166D1">Feature Pipeline</text><text x="480" y="400" font-size="19" fill="#2166D1">검증·파생변수</text><text x="480" y="433" font-size="15" fill="#607589">결측 · 범위 · 데이터 누수 점검</text>
      <text x="800" y="366" font-size="21" font-weight="700" fill="#238D4F">수요예측 ML</text><text x="800" y="400" font-size="19" fill="#238D4F">Gradient Boosting</text><text x="800" y="433" font-size="15" fill="#607589">품목별 향후 30분 수요</text>
      <text x="1125" y="366" font-size="21" font-weight="700" fill="#D96517">폐기위험 규칙</text><text x="1125" y="400" font-size="18" fill="#D96517">LOW · MEDIUM · HIGH</text><text x="1125" y="433" font-size="15" fill="#607589">재고 · 판매속도 기반 판정</text>
      <text x="1450" y="366" font-size="21" font-weight="700" fill="#7047EB">LangGraph Agent</text><text x="1450" y="400" font-size="19" fill="#7047EB">행동 후보 생성</text><text x="1450" y="433" font-size="15" fill="#607589">절차 · 근거 · 대안 구성</text>
    </g>

    <!-- human gate -->
    <rect x="1340" y="520" width="220" height="72" rx="18" fill="#EEE7FF" stroke="#D7C9FF"/>
    <text x="1450" y="550" text-anchor="middle" font-size="17" font-weight="700" fill="#7047EB">Human-in-the-loop</text>
    <text x="1450" y="576" text-anchor="middle" font-size="15" fill="#607589">AI는 제안, 사람은 최종 결정</text>

    <!-- execution row -->
    <g filter="url(#shadow)">
      <rect x="1325" y="682" width="250" height="130" rx="20" fill="#FFF0F0" stroke="#F05252" stroke-width="3"/>
      <rect x="1000" y="682" width="250" height="130" rx="20" fill="#FFF5EC" stroke="#F47B20" stroke-width="3"/>
      <rect x="675" y="682" width="250" height="130" rx="20" fill="#EDF9F2" stroke="#21A87D" stroke-width="3"/>
    </g>
    <g text-anchor="middle">
      <text x="1450" y="728" font-size="22" font-weight="700" fill="#C83C3C">운영자 승인</text><text x="1450" y="766" font-size="18" font-weight="700" fill="#C83C3C">미승인 시 실행하지 않음</text>
      <text x="1125" y="728" font-size="21" font-weight="700" fill="#D96517">승인된 Action 실행</text><text x="1125" y="766" font-size="17" fill="#D96517">할인 · 조리중단 · 부스 간 이동</text>
      <text x="800" y="728" font-size="21" font-weight="700" fill="#168765">학생 혜택 노출</text><text x="800" y="766" font-size="17" fill="#168765">알림·추천으로 수요 유도</text>
    </g>

    <!-- clear feedback loop -->
    <path d="M675 747L350 747L350 480L480 480L480 465" fill="none" stroke="#14A57F" stroke-width="4"/>
    <path d="M480 465L470 482L490 482Z" fill="#14A57F"/>
    <rect x="378" y="696" width="250" height="72" rx="16" fill="#E8F7F1"/>
    <text x="503" y="725" text-anchor="middle" font-size="17" font-weight="700" fill="#168765">성과 데이터 환류</text><text x="503" y="750" text-anchor="middle" font-size="14" fill="#607589">판매·재고·반응을 다음 예측에 반영</text>

    <!-- role legend -->
    <rect x="80" y="880" width="1495" height="68" rx="18" fill="#102A43"/>
    <text x="827" y="921" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">ML: 수요 예측  ·  규칙: 위험 판정  ·  Agent: 절차 관리  ·  운영자: 실행 결정  ·  LLM: 근거 설명</text>
  </g>
</svg>
