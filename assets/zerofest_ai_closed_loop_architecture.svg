    <rect x="110" y="232" width="92" height="24" rx="12" fill="#FFF4D6"/><text x="156" y="249" text-anchor="middle" font-size="13" font-weight="700" fill="#9B6712">SYNTHETIC</text>

    <g fill="none" stroke="#8899AA" stroke-width="3" marker-end="url(#zf-a)">
      <path d="M340 273L410 367"/><path d="M340 403L410 403"/><path d="M340 533L410 439"/>
      <path d="M650 403L715 403"/><path d="M955 403L1020 403"/><path d="M1260 403L1325 403"/>
