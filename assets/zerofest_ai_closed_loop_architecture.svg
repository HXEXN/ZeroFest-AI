      <rect x="1325" y="335" width="250" height="136" rx="20" fill="#F5F0FF" stroke="#8252F2" stroke-width="3"/>
    </g>
    <g text-anchor="middle">
      <text x="530" y="377" font-size="22" font-weight="700" fill="#2166D1">Feature Pipeline</text><text x="530" y="410" font-size="20" fill="#2166D1">검증·파생변수</text><text x="530" y="442" font-size="16" fill="#607589">결측 · 범위 · 누수 점검</text>
      <text x="835" y="377" font-size="22" font-weight="700" fill="#238D4F">수요예측 ML</text><text x="835" y="410" font-size="20" fill="#238D4F">Gradient Boosting</text><text x="835" y="442" font-size="16" fill="#607589">품목별 30분 수요 예측</text>
      <text x="1140" y="377" font-size="22" font-weight="700" fill="#D96517">폐기위험 규칙</text><text x="1140" y="410" font-size="19" fill="#D96517">LOW · MEDIUM · HIGH</text><text x="1140" y="442" font-size="16" fill="#607589">재고 · 판매속도 기반</text>
      <text x="1450" y="377" font-size="22" font-weight="700" fill="#7047EB">LangGraph Agent</text><text x="1450" y="410" font-size="20" fill="#7047EB">행동 후보 생성</text><text x="1450" y="442" font-size="16" fill="#607589">절차 · 근거 · 옵션 구성</text>
    </g>

    <rect x="1345" y="535" width="210" height="72" rx="36" fill="#F0EAFE"/>
    <text x="1450" y="565" text-anchor="middle" font-size="17" font-weight="700" fill="#7047EB">Human-in-the-loop</text>
    <text x="1450" y="589" text-anchor="middle" font-size="15" fill="#607589">사람이 최종 실행 결정</text>

    <g filter="url(#zf-shadow)">
      <rect x="1325" y="685" width="250" height="120" rx="20" fill="#FFF0F0" stroke="#F05252" stroke-width="3"/>
