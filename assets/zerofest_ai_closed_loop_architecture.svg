    <marker id="zf-g" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#14A57F"/></marker>
  </defs>
  <rect width="1800" height="1000" fill="url(#zf-bg)"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
    <text x="90" y="82" font-size="42" font-weight="700" fill="#102A43">ZeroFest AI 폐루프 아키텍처</text>
    <text x="90" y="123" font-size="20" fill="#6A7D90">예측을 운영 승인과 학생 수요 변화까지 연결하고, 새 판매 데이터로 다시 학습합니다.</text>

    <g font-size="15" font-weight="700" letter-spacing="1.5">
      <text x="90" y="190" fill="#6A7D90">01 · DATA INPUT</text>
      <text x="430" y="190" fill="#2166D1">02 · PREDICT &amp; ASSESS</text>
      <text x="1385" y="190" fill="#7047EB">03 · DECIDE</text>
      <text x="770" y="650" fill="#D36B1F">04 · APPROVE &amp; ACT</text>
    </g>

    <g filter="url(#zf-shadow)">
      <rect x="90" y="220" width="250" height="106" rx="18" fill="#FFFFFF" stroke="#CAD6E2" stroke-width="2"/>
      <rect x="90" y="350" width="250" height="106" rx="18" fill="#FFFFFF" stroke="#CAD6E2" stroke-width="2"/>
      <rect x="90" y="480" width="250" height="106" rx="18" fill="#FFFFFF" stroke="#CAD6E2" stroke-width="2"/>
    </g>
    <g text-anchor="middle" fill="#223C54">
      <text x="215" y="259" font-size="21" font-weight="700">과거 축제 이력</text><text x="215" y="292" font-size="18" fill="#607589">2023–2025 합성 CSV</text>
      <text x="215" y="389" font-size="21" font-weight="700">당일 판매·재고</text><text x="215" y="422" font-size="18" fill="#607589">30분 단위 상태</text>
      <text x="215" y="519" font-size="21" font-weight="700">날씨·공연 일정</text><text x="215" y="552" font-size="18" fill="#607589">외부 맥락</text>
