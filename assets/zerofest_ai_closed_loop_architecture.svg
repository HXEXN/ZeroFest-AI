    <g text-anchor="middle">
      <text x="1450" y="730" font-size="23" font-weight="700" fill="#C83C3C">운영자 승인</text><text x="1450" y="766" font-size="18" font-weight="700" fill="#C83C3C">미승인 시 실행 없음</text>
      <text x="1140" y="726" font-size="22" font-weight="700" fill="#D96517">승인 Action 실행</text><text x="1140" y="763" font-size="18" fill="#D96517">할인 · 조리중단 · 이동</text>
      <text x="835" y="726" font-size="22" font-weight="700" fill="#168765">학생 혜택 노출</text><text x="835" y="763" font-size="18" fill="#168765">수요 유도</text>
    </g>

    <path d="M715 745L385 745L385 455L410 455" fill="none" stroke="#14A57F" stroke-width="4" marker-end="url(#zf-g)"/>
    <rect x="420" y="711" width="250" height="68" rx="16" fill="#EAF7F2"/>
    <text x="545" y="739" text-anchor="middle" font-size="17" font-weight="700" fill="#168765">Feedback Loop</text><text x="545" y="762" text-anchor="middle" font-size="15" fill="#607589">판매·반응 결과를 다음 예측에 환류</text>

    <rect x="90" y="875" width="1485" height="70" rx="18" fill="#102A43"/>
    <text x="832" y="918" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">ML은 수치 예측 · 규칙은 위험 판정 · Agent는 절차 관리 · 사람은 실행 결정 · LLM은 근거 설명</text>
  </g>
