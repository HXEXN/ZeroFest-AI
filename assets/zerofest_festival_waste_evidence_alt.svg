  <rect width="1600" height="900" fill="url(#bg2)"/>
  <text x="80" y="85" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="42" font-weight="700" fill="#082A50">참여자는 체감했고, 폐기물은 실제 증가했다</text>
  <text x="80" y="126" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="20" fill="#617789">대학 축제 인식조사 × 식음료 소비 집중 축제의 보조 사례</text>

