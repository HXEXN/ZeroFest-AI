  <text x="800" y="834" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" fill="#D6E4EC">충장축제 수치는 대학 축제의 직접 폐기량 통계가 아니라 식음료 소비 집중 환경을 보여주는 사례입니다.</text>
