    <linearGradient id="teal2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#087B70"/><stop offset="1" stop-color="#26B89E"/></linearGradient>
    <linearGradient id="lime2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5AAE16"/><stop offset="1" stop-color="#9CDD2B"/></linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="9" stdDeviation="18" flood-color="#082A50" flood-opacity=".08"/></filter>
