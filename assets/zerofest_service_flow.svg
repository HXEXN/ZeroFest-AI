<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FBFCFE"/><stop offset="1" stop-color="#F0F8F5"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#102A43" flood-opacity=".08"/></filter>
    <symbol id="icon-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18M8 14h3M8 17h6"/></symbol>
    <symbol id="icon-input" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3v4h6V3M8 12h8M8 16h5"/></symbol>
    <symbol id="icon-chart" viewBox="0 0 24 24"><path d="M4 4v16h16M7 16l4-5 3 2 5-7"/><path d="M16 6h3v3"/></symbol>
    <symbol id="icon-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 22h4M9 17v-1c-2-1.2-3-3.2-3-5.5a6 6 0 0 1 12 0c0 2.3-1 4.3-3 5.5v1z"/></symbol>
    <symbol id="icon-shield" viewBox="0 0 24 24"><path d="M12 2l8 4v6c0 5-3.4 8.5-8 10-4.6-1.5-8-5-8-10V6z"/><path d="M8.5 12l2.2 2.2 4.8-5"/></symbol>
    <symbol id="icon-megaphone" viewBox="0 0 24 24"><path d="M4 10v4l12 4V6zM16 9h3M17 5l2-2M17 19l2 2M6 15l2 6h3l-2-5"/></symbol>
    <symbol id="icon-dashboard" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7 15l3-3 3 2 4-5M7 18h10"/></symbol>
  </defs>
  <rect width="1800" height="1000" fill="url(#bg)"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
    <text x="80" y="76" font-size="40" font-weight="700" fill="#102A43">ZeroFest AI 서비스 이용 흐름</text>
    <text x="80" y="116" font-size="20" fill="#667B8E">행사 준비부터 현장 실행·학생 수요 전환·재예측까지 이어지는 7단계 운영 여정</text>

    <!-- phase labels -->
    <rect x="80" y="154" width="380" height="40" rx="20" fill="#EAF2FF"/><text x="270" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#286BE6">행사 준비</text>
    <rect x="490" y="154" width="380" height="40" rx="20" fill="#EAF7F2"/><text x="680" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#1E936A">현장 데이터</text>
    <rect x="900" y="154" width="790" height="40" rx="20" fill="#FFF1E8"/><text x="1295" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#D76819">AI 분석·운영 의사결정</text>

    <!-- top row cards 1-4 -->
    <g filter="url(#shadow)">
      <rect x="80" y="225" width="380" height="245" rx="24" fill="#FFFFFF" stroke="#3478F6" stroke-width="3"/>
      <rect x="490" y="225" width="380" height="245" rx="24" fill="#FFFFFF" stroke="#3478F6" stroke-width="3"/>
      <rect x="900" y="225" width="380" height="245" rx="24" fill="#FFFFFF" stroke="#27A65A" stroke-width="3"/>
      <rect x="1310" y="225" width="380" height="245" rx="24" fill="#FFFFFF" stroke="#F47B20" stroke-width="3"/>
    </g>
    <g>
      <circle cx="130" cy="275" r="27" fill="#3478F6"/><text x="130" y="284" text-anchor="middle" font-size="25" font-weight="700" fill="#FFFFFF">1</text>
      <circle cx="540" cy="275" r="27" fill="#3478F6"/><text x="540" y="284" text-anchor="middle" font-size="25" font-weight="700" fill="#FFFFFF">2</text>
      <circle cx="950" cy="275" r="27" fill="#27A65A"/><text x="950" y="284" text-anchor="middle" font-size="25" font-weight="700" fill="#FFFFFF">3</text>
      <circle cx="1360" cy="275" r="27" fill="#F47B20"/><text x="1360" y="284" text-anchor="middle" font-size="25" font-weight="700" fill="#FFFFFF">4</text>
