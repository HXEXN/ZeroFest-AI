      <circle cx="820" cy="275" r="28" fill="#EAF2FF" stroke="none"/><use href="#icon-input" x="806" y="261" width="28" height="28" stroke="#286BE6"/>
      <circle cx="1230" cy="275" r="28" fill="#EAF7F2" stroke="none"/><use href="#icon-chart" x="1216" y="261" width="28" height="28" stroke="#1E936A"/>
      <circle cx="1640" cy="275" r="28" fill="#FFF1E8" stroke="none"/><use href="#icon-bulb" x="1626" y="261" width="28" height="28" stroke="#D76819"/>
    </g>
    <g font-size="25" font-weight="700" fill="#18364F">
      <text x="175" y="284">행사 전 등록</text><text x="585" y="284">행사 중 입력</text><text x="995" y="284">AI 분석</text><text x="1405" y="284">운영 추천</text>
    </g>
    <g font-size="18" fill="#314E65">
      <text x="115" y="344">부스 · 메뉴 · 가격</text><text x="115" y="376">초기 재고 등록</text>
      <text x="525" y="344">판매량 · 현재 재고 입력</text><text x="525" y="376">날씨 · 시간 · 공연 결합</text>
      <text x="935" y="344">향후 판매량 · 종료 시점</text><text x="935" y="376">예상 잔여재고 예측</text><text x="935" y="408">폐기 위험도 판단</text>
      <text x="1345" y="344">할인 · 추가 조리 중단</text><text x="1345" y="376">재고 이동 Action</text><text x="1345" y="408">추천 근거 제시</text>
    </g>
    <g>
      <rect x="115" y="414" width="178" height="38" rx="19" fill="#EAF2FF"/><text x="204" y="439" text-anchor="middle" font-size="15" font-weight="700" fill="#286BE6">부스 운영자</text>
      <rect x="525" y="414" width="198" height="38" rx="19" fill="#EAF2FF"/><text x="624" y="439" text-anchor="middle" font-size="15" font-weight="700" fill="#286BE6">운영자 + 시스템</text>
      <rect x="935" y="414" width="178" height="38" rx="19" fill="#EAF7F2"/><text x="1024" y="439" text-anchor="middle" font-size="15" font-weight="700" fill="#1E936A">수요예측 ML</text>
      <rect x="1345" y="414" width="178" height="38" rx="19" fill="#FFF1E8"/><text x="1434" y="439" text-anchor="middle" font-size="15" font-weight="700" fill="#D76819">규칙 + Agent</text>
    </g>

    <!-- top arrows -->
    <g stroke="#899AAA" stroke-width="4"><line x1="460" y1="347" x2="490" y2="347"/><line x1="870" y1="347" x2="900" y2="347"/><line x1="1280" y1="347" x2="1310" y2="347"/></g>
    <g fill="#899AAA"><path d="M490 347L474 337L474 357Z"/><path d="M900 347L884 337L884 357Z"/><path d="M1310 347L1294 337L1294 357Z"/></g>

    <!-- down turn 4 to 5 -->
    <path d="M1500 470L1500 545" fill="none" stroke="#899AAA" stroke-width="4"/>
    <path d="M1500 545L1490 528L1510 528Z" fill="#899AAA"/>

