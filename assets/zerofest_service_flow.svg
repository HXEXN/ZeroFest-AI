    <g filter="url(#shadow)">
      <rect x="180" y="575" width="430" height="240" rx="24" fill="#FFFFFF" stroke="#14A57F" stroke-width="3"/>
      <rect x="685" y="575" width="430" height="240" rx="24" fill="#FFFFFF" stroke="#8252F2" stroke-width="3"/>
      <rect x="1190" y="575" width="430" height="240" rx="24" fill="#FFFFFF" stroke="#F05252" stroke-width="3"/>
    </g>
    <g>
      <circle cx="230" cy="625" r="27" fill="#14A57F"/><text x="230" y="634" text-anchor="middle" font-size="25" font-weight="700" fill="#FFFFFF">7</text>
      <circle cx="735" cy="625" r="27" fill="#8252F2"/><text x="735" y="634" text-anchor="middle" font-size="25" font-weight="700" fill="#FFFFFF">6</text>
      <circle cx="1240" cy="625" r="27" fill="#F05252"/><text x="1240" y="634" text-anchor="middle" font-size="25" font-weight="700" fill="#FFFFFF">5</text>
    </g>
    <g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="560" cy="625" r="28" fill="#EAF7F2" stroke="none"/><use href="#icon-dashboard" x="546" y="611" width="28" height="28" stroke="#1E936A"/>
      <circle cx="1065" cy="625" r="28" fill="#F2EDFF" stroke="none"/><use href="#icon-megaphone" x="1051" y="611" width="28" height="28" stroke="#7047EB"/>
      <circle cx="1570" cy="625" r="28" fill="#FFF0F0" stroke="none"/><use href="#icon-shield" x="1556" y="611" width="28" height="28" stroke="#C83C3C"/>
    </g>
    <g font-size="24" font-weight="700" fill="#18364F">
      <text x="275" y="634">재예측 · 통합 관제</text><text x="780" y="634">실행 · 수요 전환</text><text x="1285" y="634">운영자 승인</text>
    </g>
    <g font-size="18" fill="#314E65">
      <text x="215" y="694">변경된 판매 · 재고 재분석</text><text x="215" y="726">잔여재고 · 위험도 갱신</text><text x="215" y="758">학생회 전체 부스 관제</text>
      <text x="720" y="694">승인된 할인만 학생 화면 반영</text><text x="720" y="726">주변 혜택 노출로 구매 유도</text>
      <text x="1225" y="694">추천 내용 · 근거 확인</text><text x="1225" y="726">실행 또는 거절 결정</text><text x="1225" y="758">미승인 시 실행 없음</text>
    </g>
    <g>
      <rect x="215" y="768" width="210" height="34" rx="17" fill="#EAF7F2"/><text x="320" y="791" text-anchor="middle" font-size="14" font-weight="700" fill="#1E936A">AI + 학생회 대시보드</text>
      <rect x="720" y="768" width="178" height="34" rx="17" fill="#F2EDFF"/><text x="809" y="791" text-anchor="middle" font-size="14" font-weight="700" fill="#7047EB">운영자 + 학생</text>
      <rect x="1225" y="768" width="198" height="34" rx="17" fill="#FFF0F0"/><text x="1324" y="791" text-anchor="middle" font-size="14" font-weight="700" fill="#C83C3C">Human-in-the-loop</text>
    </g>

    <!-- bottom arrows: 5 to 6 to 7 -->
    <g stroke="#899AAA" stroke-width="4"><line x1="1190" y1="695" x2="1115" y2="695"/><line x1="685" y1="695" x2="610" y2="695"/></g>
    <g fill="#899AAA"><path d="M1115 695L1132 685L1132 705Z"/><path d="M610 695L627 685L627 705Z"/></g>

    <!-- rolling loop 7 back to 2 -->
    <path d="M395 815L395 862L680 862L680 845L680 470" fill="none" stroke="#14A57F" stroke-width="4" stroke-dasharray="10 8"/>
    <path d="M680 470L670 488L690 488Z" fill="#14A57F"/>
    <rect x="470" y="838" width="420" height="48" rx="24" fill="#E7F7F1"/>
    <text x="680" y="869" text-anchor="middle" font-size="16" font-weight="700" fill="#168765">30분 Rolling Loop · 새 판매·재고를 ② 현재 상태로 환류</text>

    <rect x="965" y="850" width="655" height="58" rx="18" fill="#102A43"/>
    <text x="1292" y="886" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">AI는 추천하고, 사람은 승인하며, 승인된 정보만 학생에게 노출됩니다.</text>
    <text x="80" y="954" font-size="15" fill="#6A7D90">역할 분리: 운영자 입력·승인 │ ML 예측 │ 규칙·Agent 추천 │ 학생 수요 반응 │ 학생회 통합 관제</text>
  </g>
</svg>
